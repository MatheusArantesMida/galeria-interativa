<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Prática — Galeria de Fotos com Grid Mosaico</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="pagina-inicial">
    <header>
        <h1>
            <a href="./index.html">The House of Spiders</a>
        </h1>
            <div class="p_links">
                <p><a href="./theThumb.html">The Thumb</a></p>
                <p><a href="./theIndex.html">The Index</a></p>
                <p><a href="./theMiddle.html">The Middle</a></p>
                <p><a href="./theRing.html">The Ring</a></p>
                <p><a href="./thePinky.html">The Pinky</a></p>
            </div>   
    </header>
    <main class="galeria">
        <img src="./assents/Foto1.png" alt="Blade_of_the_House_of_Spiders_Ryōshū_png"
        class="miniatura grande" tabindex="1">
        <img src="./assents/Foto2.png" alt="The_Index_Nursefather_Yi_Sang_png"
        class="miniatura horizontal" tabindex="2">
        <img src="./assents/Foto3.png" alt="The_Index_Apprentice_Don_Quixote_png"
        class="miniatura" tabindex="3">
        <img src="./assents/Foto4.png" alt="The_Thumb_Nursefather_Rodion_png"
        class="miniatura vertical" tabindex="4">
        <img src="./assents/Foto5.png" alt="The_Middle_Apprentice_Ishmael_png"
        class="miniatura" tabindex="5">
        <img src="./assents/Foto6.png" alt="The_Middle_Nursefather_Outis_png"
        class="miniatura horizontal" tabindex="6">
        <img src="./assents/Foto7.png" alt="The_Ring_Apprentice_Faust_png"
        class="miniatura" tabindex="7">
        <img src="./assents/Foto8.png" alt="The_Ring_Nursefather_Hong_Lu_png"
        class="miniatura horizontal" tabindex="8">
        <img src="./assents/Foto9.png" alt="The_Thumb_Apprentice_Heathcliff_png"
        class="miniatura" tabindex="9">
    </main>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Visualizador de imagens" aria-hidden="true">
        
        <button
            id="fechar"
            class="fechar"
            aria-label="Fechar imagem"
        >
            &times;
        </button>

        <button
            id="anterior"
            class="navegacao anterior"
            aria-label="imagem anterior"
        >
            &#10094;
        </button>
        <div class="modal-layout">
    <div class="modal-conteudo">
        <img src="" alt="" id="imagemModal">
    </div>
    <aside class="descricao">
        <h2 id="tituloDescricao"></h2>
        <p id="textoDescricao"></p>
    </aside>
    </div>
    <div class="legenda">
        <span id="nomeImagem"></span>
        <span id="contador"></span>
    </div>
        <button
            id="proximo"
            class="navegacao proximo"
            aria-label="Proxima imagem"
        >
         &#10095;
        </button>
    </div>
    <script src="./script/script.js"></script>
</body>
</html>
